plugins {
    id 'java-library'
    // ContractStoreContract: the double-apply/journal/receipt contract every ContractStore owes,
    // run against InMemoryContractStore here and RocksDbContractStore in lib-persistence. A test
    // fixture rather than src/main for the same reason as lib-core's ChainEngineTestAccess: it
    // exists for tests and has no business in the runtime jar. ContractStore lives in lib-vm (not
    // lib-core) because lib-vm owns the domain logic that drives it — see BootstrapTarget's
    // javadoc for why the port itself is placed here — so its conformance suite follows it.
    id 'java-test-fixtures'
}

dependencies {
    // Ledger / address / amount types shared with the consensus core.
    api project(':lib-core')

    // Deterministic, pure-Java WebAssembly runtime (no JNI) — the smart-contract VM.
    // PINNED at 1.7.5: WasmVm.preScanModule mirrors this exact version's parser internals
    // (OpCode.signature table, section decoders, count-sized pre-allocations). Bumping Chicory
    // without re-verifying the mirror silently reopens the poison-DEPLOY allocation vector —
    // see the preScanModule javadoc and WasmPreScanCountsTest.
    // `implementation`, not `api`: no public signature in lib-vm mentions a Chicory type
    // (WasmVm's public surface is byte[]/HostState/GasMeter, and the two ChicoryException
    // subclasses are package-private). Exporting it put the parser on the compile classpath of
    // lib-persistence and app-node, where a second, un-mirrored use of Parser would compile
    // cleanly and silently defeat the version pin the comment above depends on.
    implementation 'com.dylibso.chicory:runtime:1.7.5'

    // WasmVm logs the memory-max clamp once per validated module (audit: silent clamp).
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    // ChainEngineTestAccess: the reorg tests here pop the tip, which ChainEngine keeps
    // package-private on purpose. Test-scoped, so nothing in the published jar can reach it.
    testImplementation testFixtures(project(':lib-core'))

    // @Test on ContractStoreContract's default methods must stay visible to the implementing test
    // classes here and in lib-persistence — hence Api, not Implementation (see the plugin block
    // above for why this fixture exists).
    testFixturesApi "org.junit.jupiter:junit-jupiter:${junitVersion}"
}

// ---- the contract toolchain: one reproducible way to turn a .rs into its .wasm ----
//
// The contracts are #![no_std] Rust compiled to wasm32, and their binaries are CHECKED IN: the
// ordinary build, CI and the native image must not require a Rust toolchain to exist. That is
// what makes them driftable — token.rs shipped three times with a stale token.wasm beside it,
// once dropping the audit-T1 deployer guard from the source the dashboard served.
//
// So the pair is governed two ways. compileContracts (opt-in, needs Rust) regenerates the
// binaries; verifyContractFixtures (always on, needs nothing) fails the build when a .rs moves
// without its .wasm. The second is the one that catches the omission, and it costs two hashes.
def contractsDir = file('contracts')
def contractFixturesDir = file('src/test/resources')
def contractsLock = file('contracts/contracts.lock')

// The exact invocation that reproduces every checked-in binary byte for byte, recovered from the
// artefacts themselves (see contracts/README.md for how, and for the two that had drifted):
//   - opt-level=3 and strip=debuginfo are what the 9 binaries agree on once normalised;
//   - the working directory is contracts/, because rustc embeds the panic-location path VERBATIM
//     as given on the command line. Compiling `pair.rs` from contracts/ writes "pair.rs" into
//     .rodata; compiling an absolute path writes the absolute path, and the build stops being
//     reproducible across machines. This is not cosmetic — it is 41 bytes of the output.
//   - rustup resolves `rustc` through contracts/rust-toolchain.toml, so the pin needs no flag.
def rustcArgs = ['--target', 'wasm32-unknown-unknown', '--crate-type=cdylib',
                 '-C', 'opt-level=3', '-C', 'strip=debuginfo']

def contractNames = { ->
    contractsDir.listFiles({ f -> f.name.endsWith('.rs') } as FileFilter)
            .collect { it.name[0..-4] }.sort()
}

def sha256 = { File f ->
    java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes)
            .encodeHex().toString()
}

def compileContracts = tasks.register('compileContracts') {
    group = 'build'
    description = 'Recompiles every contract .rs to its checked-in .wasm. Opt-in: -Pcontracts=rebuild.'

    // Opt-in by property, not by toolchain detection: a build that silently changes behaviour
    // depending on whether a machine happens to have rustc is worse than one that never rebuilds.
    enabled = project.findProperty('contracts') == 'rebuild'

    inputs.dir(contractsDir)
    outputs.dir(contractFixturesDir)

    doLast {
        def rebuilt = []
        contractNames().each { name ->
            def out = new File(contractFixturesDir, "${name}.wasm")
            def before = out.exists() ? out.bytes : null
            def result = providers.exec {
                // From contracts/: fixes both the panic path and the toolchain resolution.
                workingDir = contractsDir
                commandLine(['rustc'] + rustcArgs + ['-o', out.absolutePath, "${name}.rs"])
                ignoreExitValue = true
            }
            if (result.result.get().exitValue != 0) {
                throw new GradleException("rustc failed on contracts/${name}.rs:\n" +
                        result.standardError.asText.get())
            }
            if (before == null || !java.util.Arrays.equals(before, out.bytes)) {
                rebuilt << name
            }
        }
        writeContractsLock(contractsLock, contractNames(), contractsDir, contractFixturesDir, sha256)
        logger.lifecycle(rebuilt.isEmpty()
                ? 'compileContracts: every .wasm was already byte-identical to its source'
                : "compileContracts: rebuilt ${rebuilt.join(', ')} — review the binary diff before committing")
    }
}

def verifyContractFixtures = tasks.register('verifyContractFixtures') {
    group = 'verification'
    description = 'Fails when a contract .rs changed without its .wasm being rebuilt.'

    inputs.dir(contractsDir)
    inputs.dir(contractFixturesDir)
    outputs.upToDateWhen { true }

    doLast {
        if (!contractsLock.exists()) {
            throw new GradleException("${rootProject.relativePath(contractsLock)} is missing — " +
                    'regenerate it with ./gradlew :lib-vm:compileContracts -Pcontracts=rebuild')
        }
        def locked = [:]
        contractsLock.eachLine { line ->
            def t = line.trim()
            if (t && !t.startsWith('#')) {
                def parts = t.split(/\s+/)
                locked[parts[0]] = [rs: parts[1], wasm: parts[2]]
            }
        }
        def names = contractNames()
        def unlocked = names - locked.keySet()
        if (unlocked) {
            throw new GradleException('contract(s) with no entry in ' +
                    "${rootProject.relativePath(contractsLock)}: ${unlocked.join(', ')} — " +
                    'run ./gradlew :lib-vm:compileContracts -Pcontracts=rebuild')
        }
        def orphaned = locked.keySet() - names
        if (orphaned) {
            throw new GradleException("${rootProject.relativePath(contractsLock)} still lists deleted " +
                    "contract(s): ${orphaned.join(', ')}")
        }
        def stale = []
        names.each { name ->
            def rs = new File(contractsDir, "${name}.rs")
            def wasm = new File(contractFixturesDir, "${name}.wasm")
            if (!wasm.exists()) {
                throw new GradleException("contracts/${name}.rs has no compiled ${name}.wasm")
            }
            if (sha256(rs) != locked[name].rs || sha256(wasm) != locked[name].wasm) {
                stale << name
            }
        }
        if (stale) {
            // The whole point: an edited .rs whose .wasm was not rebuilt is now a build failure
            // demanding a deliberate gesture, instead of a dashboard quietly serving a source
            // that does not describe the binary beside it (audit T1).
            throw new GradleException('contract source/binary pair(s) out of sync: ' +
                    "${stale.join(', ')}\n" +
                    'Rebuild them with:  ./gradlew :lib-vm:compileContracts -Pcontracts=rebuild\n' +
                    '(needs the toolchain pinned in lib-vm/contracts/rust-toolchain.toml)')
        }
    }
}

tasks.named('check') { dependsOn verifyContractFixtures }
tasks.named('processTestResources') { mustRunAfter compileContracts }

static void writeContractsLock(File lock, List names, File srcDir, File wasmDir, Closure sha256) {
    def rows = names.collect { name ->
        [name, sha256(new File(srcDir, "${name}.rs")), sha256(new File(wasmDir, "${name}.wasm"))]
    }
    def width = rows.collect { it[0].length() }.max()
    lock.text = '''\
# Contract source/binary pairs, by sha256. Generated — do not hand-edit.
#
# verifyContractFixtures compares these on every build, so an edited .rs whose .wasm was not
# rebuilt fails loudly instead of shipping a source that does not describe its binary. The check
# needs no Rust toolchain; regenerating this file does.
#
#   ./gradlew :lib-vm:compileContracts -Pcontracts=rebuild
#
# name                sha256(.rs)                                                       sha256(.wasm)
''' + rows.collect { r -> "${r[0].padRight(width)}  ${r[1]}  ${r[2]}" }.join('\n') + '\n'
}
