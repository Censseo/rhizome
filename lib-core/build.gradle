plugins {
    id 'java-library'
    // ChainEngineTestAccess — the bridge to ChainEngine's package-private popBlock — used to ship
    // in src/main, so a production binary carried a public entry point to chain truncation for the
    // sake of tests in other modules. As a test fixture it stays visible to lib-core's own tests
    // and to lib-persistence's (via testFixtures(project(':lib-core'))), and disappears from the
    // runtime jar.
    id 'java-test-fixtures'
}

dependencies {
    // Exposed as `api`: crypto types (PublicKey, SHA256Hash, ...) appear
    // throughout lib-core's public signatures.
    api project(':lib-crypto')

    // Address derivation (PublicAddress) uses BouncyCastle digests directly.
    implementation "org.bouncycastle:bcprov-jdk18on:${bouncycastleVersion}"

    // JSONObject appears in the domain toJson()/fromJson() signatures (Block, Transaction, User).
    api "org.json:json:${jsonVersion}"

    // API only (no backend): the synchronizers log a failed post-reorg restore at ERROR; the
    // application's runtime provides the backend (logback in app-node, NOP in tests).
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    compileOnly 'org.jetbrains:annotations:24.1.0'

    // The store-conformance suites (BoxStoreContract, TokenStoreContract, ...) are JUnit test
    // interfaces: their @Test default methods must stay VISIBLE to the implementing test classes
    // in lib-persistence and here, so `Api` — under `Implementation` the annotations would compile
    // but vanish from consumers' compile classpath and the inherited tests would silently not be
    // discovered. The root `subprojects` block only wires JUnit onto src/test, not testFixtures.
    testFixturesApi "org.junit.jupiter:junit-jupiter:${junitVersion}"
}
