plugins {
    id 'java-library'
    // ChainEngineTestAccess — the bridge to ChainEngine's package-private popBlock — used to ship
    // in src/main, so a production binary carried a public entry point to chain truncation for the
    // sake of tests in other modules. As a test fixture it stays visible to lib-core's own tests
    // and to lib-persistence's (via testFixtures(project(':lib-core'))), and disappears from the
    // runtime jar.
    id 'java-test-fixtures'
}

dependencies {
    // Exposed as `api`: crypto types (PublicKey, SHA256Hash, ...) appear
    // throughout lib-core's public signatures.
    api project(':lib-crypto')

    // Address derivation (PublicAddress) uses BouncyCastle digests directly.
    implementation "org.bouncycastle:bcprov-jdk18on:${bouncycastleVersion}"

    // JSONObject appears in the domain toJson()/fromJson() signatures (Block, Transaction, User).
    api "org.json:json:${jsonVersion}"

    // API only (no backend): the synchronizers log a failed post-reorg restore at ERROR; the
    // application's runtime provides the backend (logback in app-node, NOP in tests).
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    compileOnly 'org.jetbrains:annotations:24.1.0'

    // The store-conformance suites (BoxStoreContract, TokenStoreContract, ...) are JUnit test
    // interfaces: their @Test default methods must stay VISIBLE to the implementing test classes
    // in lib-persistence and here, so `Api` — under `Implementation` the annotations would compile
    // but vanish from consumers' compile classpath and the inherited tests would silently not be
    // discovered. The root `subprojects` block only wires JUnit onto src/test, not testFixtures.
    testFixturesApi "org.junit.jupiter:junit-jupiter:${junitVersion}"
}

// ---- adversarial test protocol gate ----
// AdversarialProtocolTest reads docs/adversarial/spec.md and the test SOURCES it cites as text, at
// runtime. Gradle sees none of that as an input, so editing ONLY the catalogue left :lib-core:test
// UP-TO-DATE and the build green with a broken proof link — precisely the failure the protocol
// exists to prevent, and its most likely edit. The gate therefore gets its own task with those
// files declared.
//
// Why not simply declare them on `test`: the cited proofs live in every module, so `test` would
// re-run lib-core's 550 tests whenever any test anywhere is touched. Isolated, the gate is six
// tests and re-runs in about a second, which is affordable at that trigger rate.
def adversarialProtocolCheck = tasks.register('adversarialProtocolCheck', Test) {
    group = 'verification'
    description = 'Checks docs/adversarial/spec.md against the tests it cites, in both directions.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'rhizome.adversarial.AdversarialProtocolTest'
    }
    inputs.file(rootProject.file('docs/adversarial/spec.md'))
        .withPropertyName('protocolCatalogue')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(rootProject.subprojects.collect { module ->
            module.fileTree('src/test/java') { include '**/*.java' }
        })
        .withPropertyName('citedProofSources')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.named('check') {
    dependsOn adversarialProtocolCheck
}
