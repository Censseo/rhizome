plugins {
    id 'java-library'
    // ContractStoreContract: the double-apply/journal/receipt contract every ContractStore owes,
    // run against InMemoryContractStore here and RocksDbContractStore in lib-persistence. A test
    // fixture rather than src/main for the same reason as lib-core's ChainEngineTestAccess: it
    // exists for tests and has no business in the runtime jar. ContractStore lives in lib-vm (not
    // lib-core) because lib-vm owns the domain logic that drives it — see BootstrapTarget's
    // javadoc for why the port itself is placed here — so its conformance suite follows it.
    id 'java-test-fixtures'
}

dependencies {
    // Ledger / address / amount types shared with the consensus core.
    api project(':lib-core')

    // Deterministic, pure-Java WebAssembly runtime (no JNI) — the smart-contract VM.
    // PINNED at 1.7.5: WasmVm.preScanModule mirrors this exact version's parser internals
    // (OpCode.signature table, section decoders, count-sized pre-allocations). Bumping Chicory
    // without re-verifying the mirror silently reopens the poison-DEPLOY allocation vector —
    // see the preScanModule javadoc and WasmPreScanCountsTest.
    // `implementation`, not `api`: no public signature in lib-vm mentions a Chicory type
    // (WasmVm's public surface is byte[]/HostState/GasMeter, and the two ChicoryException
    // subclasses are package-private). Exporting it put the parser on the compile classpath of
    // lib-persistence and app-node, where a second, un-mirrored use of Parser would compile
    // cleanly and silently defeat the version pin the comment above depends on.
    implementation 'com.dylibso.chicory:runtime:1.7.5'

    // WasmVm logs the memory-max clamp once per validated module (audit: silent clamp).
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    // ChainEngineTestAccess: the reorg tests here pop the tip, which ChainEngine keeps
    // package-private on purpose. Test-scoped, so nothing in the published jar can reach it.
    testImplementation testFixtures(project(':lib-core'))

    // @Test on ContractStoreContract's default methods must stay visible to the implementing test
    // classes here and in lib-persistence — hence Api, not Implementation (see the plugin block
    // above for why this fixture exists).
    testFixturesApi "org.junit.jupiter:junit-jupiter:${junitVersion}"
}
