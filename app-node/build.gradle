plugins {
    id 'application'
}

dependencies {
    implementation project(':lib-core')
    implementation project(':lib-net')
    implementation project(':lib-persistence')
    implementation project(':lib-vm')

    implementation "${activejGroup}:activej-http:${activejVersion}"
    // activej-eventloop also provides the io.activej.reactor package.
    implementation "${activejGroup}:activej-eventloop:${activejVersion}"
    implementation "${activejGroup}:activej-promise:${activejVersion}"
    implementation "${activejGroup}:activej-csp:${activejVersion}"
    implementation "${activejGroup}:activej-bytebuf:${activejVersion}"

    implementation "org.json:json:${jsonVersion}"

    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    runtimeOnly "ch.qos.logback:logback-classic:${logbackVersion}"
}

application {
    mainClass = 'rhizome.node.RhizomeNode'
}

// ---- self-served documentation ----
// The node serves its own docs, so the repository markdown is staged into the jar at build
// time rather than read from the working tree at runtime: a bare jar and the GraalVM native
// binary must both carry the documentation they claim to serve.
//
// The page list is explicit rather than globbed. Nav order is editorial, the groups are, and
// a spec that is not listed fails the build (see the completeness check below) instead of
// silently disappearing from the served docs. Titles come from each file's H1, so they cannot
// drift from the document.
def docPages = [
    [slug: 'readme',       group: 'Vue d\'ensemble', source: 'README.md'],
    [slug: 'whitepaper',   group: 'Vue d\'ensemble', source: 'WHITEPAPER.md'],
    [slug: 'index',        group: 'Vue d\'ensemble', source: 'docs/README.md'],
    [slug: 'platform',     group: 'Vue d\'ensemble', source: 'docs/platform/spec.md'],
    [slug: 'consensus',    group: 'Protocole',       source: 'docs/consensus/spec.md'],
    [slug: 'transactions', group: 'Protocole',       source: 'docs/transactions/spec.md'],
    [slug: 'state',        group: 'Protocole',       source: 'docs/state/spec.md'],
    [slug: 'crypto',       group: 'Protocole',       source: 'docs/crypto/spec.md'],
    [slug: 'persistence',  group: 'Protocole',       source: 'docs/persistence/spec.md'],
    [slug: 'networking',   group: 'Réseau',          source: 'docs/networking/spec.md'],
    [slug: 'node-api',     group: 'Réseau',          source: 'docs/node-api/spec.md'],
    [slug: 'contracts',    group: 'Applicatif',      source: 'docs/contracts/spec.md'],
    [slug: 'tokens',       group: 'Applicatif',      source: 'docs/tokens/spec.md'],
    [slug: 'banknotes',    group: 'Applicatif',      source: 'docs/banknotes/spec.md'],
    [slug: 'boxes',        group: 'Applicatif',      source: 'docs/boxes/spec.md'],
    [slug: 'wallet',       group: 'Clients',         source: 'docs/wallet/spec.md'],
    [slug: 'dashboard',    group: 'Clients',         source: 'docs/dashboard/spec.md'],
]

def stagedDocsRoot = layout.buildDirectory.dir('generated/docs-resources')

def stageDocs = tasks.register('stageDocs') {
    group = 'build'
    description = 'Stages the repository markdown documentation, plus a generated manifest, into the node resources.'

    def sources = docPages.collectEntries { [(it.slug): rootProject.file(it.source)] }
    def specTree = rootProject.fileTree('docs') { include '**/*.md' }
    def pages = docPages
    def outDir = stagedDocsRoot

    inputs.files(sources.values())
    inputs.files(specTree)          // so adding an unregistered spec re-runs the completeness check
    inputs.property('pages', pages.collect { "${it.slug}|${it.group}|${it.source}" })
    outputs.dir(outDir)

    doLast {
        // Every markdown file under docs/ must be reachable from the served nav. Catching this
        // here rather than in a test means a new spec cannot be merged unrouted.
        def declared = pages.collect { rootProject.file(it.source).canonicalFile } as Set
        def orphans = specTree.files.findAll { !declared.contains(it.canonicalFile) }
        if (orphans) {
            throw new GradleException('documentation not registered in app-node/build.gradle docPages: '
                    + orphans.collect { rootProject.relativePath(it) }.sort().join(', '))
        }

        def dir = outDir.get().dir('docs').asFile
        dir.deleteDir()
        dir.mkdirs()

        def entries = pages.collect { page ->
            def file = sources[page.slug]
            def text = file.getText('UTF-8')
            def heading = text.readLines().find { it.startsWith('# ') }
            if (heading == null) {
                throw new GradleException("${rootProject.relativePath(file)} has no level-1 heading to title it with")
            }
            new File(dir, "${page.slug}.md").setText(text, 'UTF-8')
            [slug: page.slug, title: heading.substring(2).trim(), group: page.group,
             file: "${page.slug}.md", source: rootProject.relativePath(file), bytes: file.length()]
        }
        new File(dir, 'manifest.json').setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([pages: entries])), 'UTF-8')
    }
}

sourceSets.main.resources.srcDir(stagedDocsRoot)
tasks.named('processResources') { dependsOn stageDocs }

// ---- contract templates served by the dashboard ----
// lib-vm/contracts/*.rs is the single source of a template's Rust source; lib-vm/src/test/
// resources/*.wasm the single source of its compiled binary — the same resource lib-vm's own
// tests build and audit against. The dashboard used to carry hand-maintained duplicates of
// both, and they drifted: five of eight .rs copies fell behind their audited originals while
// the .wasm shipped right beside them was already post-audit, so the dashboard's "Source"
// button showed code that did not describe the binary a "Deploy" click would install (see
// app-node/src/test/java/rhizome/node/DashboardTemplatesTest.java).
//
// dashboard/templates/manifest.json stays checked in — it is not a copy of anything, it is the
// one editorial list (name/description/method ABI) the dashboard UI reads. This task uses it as
// the list of which lib-vm contracts are templates, so the id/wasm/source triple is declared
// exactly once.
def contractsDir = rootProject.file('lib-vm/contracts')
def contractFixturesDir = rootProject.file('lib-vm/src/test/resources')
def templatesManifest = file('src/main/resources/dashboard/templates/manifest.json')
// lib-vm/contracts/*.rs that are test fixtures, not dashboard templates (LogOrderingTest's
// logtree.rs) — an explicit exclusion, so leaving a real contract out of the manifest by
// accident still fails the build below.
def nonTemplateContracts = ['logtree'] as Set

def stagedTemplatesRoot = layout.buildDirectory.dir('generated/contract-templates-resources')

def stageContractTemplates = tasks.register('stageContractTemplates') {
    group = 'build'
    description = 'Stages contract template sources and binaries from lib-vm, their single source, into the node resources.'

    inputs.file(templatesManifest)
    inputs.dir(contractsDir)
    inputs.dir(contractFixturesDir)
    inputs.property('nonTemplateContracts', nonTemplateContracts.sort())
    outputs.dir(stagedTemplatesRoot)

    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(templatesManifest)
        def templates = manifest.templates
        if (!templates) {
            throw new GradleException("${rootProject.relativePath(templatesManifest)} lists no templates")
        }

        // Every .rs in lib-vm/contracts must be a declared template or an explicit exclusion —
        // an omission must be deliberate, not merely forgotten (audit T1/T2 drifted exactly
        // this way when the dashboard's copy was hand-maintained instead of staged).
        def declaredIds = templates.collect { it.id } as Set
        def allContractIds = contractsDir.listFiles({ f -> f.name.endsWith('.rs') } as FileFilter)
                .collect { it.name[0..-4] } as Set
        def unaccounted = allContractIds - declaredIds - nonTemplateContracts
        if (unaccounted) {
            throw new GradleException('lib-vm/contracts has .rs file(s) neither listed in ' +
                    "${rootProject.relativePath(templatesManifest)} nor excluded as test-only via " +
                    'nonTemplateContracts in app-node/build.gradle: ' + unaccounted.sort().join(', '))
        }

        def dir = stagedTemplatesRoot.get().dir('dashboard/templates').asFile
        dir.deleteDir()
        dir.mkdirs()

        templates.each { t ->
            def rs = new File(contractsDir, t.source as String)
            def wasm = new File(contractFixturesDir, t.wasm as String)
            if (!rs.exists()) {
                throw new GradleException("template '${t.id}': ${rootProject.relativePath(rs)} does not exist")
            }
            if (!wasm.exists()) {
                throw new GradleException("template '${t.id}': ${rootProject.relativePath(wasm)} does not exist " +
                        '(is it built and checked in under lib-vm/src/test/resources?)')
            }
            new File(dir, t.source as String).bytes = rs.bytes
            new File(dir, t.wasm as String).bytes = wasm.bytes
        }
    }
}

sourceSets.main.resources.srcDir(stagedTemplatesRoot)
tasks.named('processResources') { dependsOn stageContractTemplates }

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

// GraalVM native-image build of the node. Reachability metadata (RocksDB JNI
// resource, logback configurators, dashboard assets) ships inside the jar under
// META-INF/native-image/rhizome/rhizome-node/ and is picked up automatically.
// Gradle 9.6.1 runs on JDK 25, so one JDK suffices: use a GraalVM as the sdkman/current
// JDK (e.g. 25.0.2-graal) and native-image is resolved from PATH.
def nativeImageOut = layout.buildDirectory.dir('native')

tasks.register('nativeImage', Exec) {
    group = 'build'
    description = 'Builds the GraalVM native binary of the node into build/native/rhizome-node.'
    dependsOn tasks.named('installDist')

    def installLib = layout.buildDirectory.dir("install/${project.name}/lib")
    inputs.dir(installLib)
    outputs.file(nativeImageOut.map { it.file('rhizome-node') })

    doFirst {
        def nativeImageBin = System.getenv('PATH').split(File.pathSeparator)
                .collect { new File(it, 'native-image') }
                .find { it.isFile() && it.canExecute() }
        if (nativeImageBin == null) {
            throw new GradleException('native-image not found on PATH. Use a GraalVM JDK as the ' +
                    'current SDK (e.g. "sdk use java 25.0.2-graal") and run ' +
                    './gradlew :app-node:nativeImage.')
        }
        def classpath = installLib.get().asFile
                .listFiles({ f -> f.name.endsWith('.jar') } as FileFilter)*.absolutePath
                .sort().join(File.pathSeparator)
        commandLine nativeImageBin.absolutePath, '--no-fallback', '-O2',
                '-cp', classpath,
                "-H:Path=${nativeImageOut.get().asFile}",
                '-H:Name=rhizome-node',
                'rhizome.node.RhizomeNode'
    }
}
