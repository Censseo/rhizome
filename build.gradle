plugins{
    id 'io.freefair.lombok' version '9.5.0'
    id 'nebula.lint' version "21.2.1"
}

allprojects {
    apply plugin: "nebula.lint"
    gradleLint {
        rules= []
    }
}

gradleLint { 
    rules= ['all-dependency']
    excludedRules= ['undeclared-dependency']
 }

// Shared dependency versions. Each module declares only what it actually
// uses in its own build.gradle; nothing is injected globally anymore.
ext {
    // Custom activej build published from the Censseo/activej fork via JitPack
    // (group com.github.Censseo.activej). Fork v7.0.0: Java 25 baseline, HTTP
    // hardening (60 s timeout default, 100 MB body cap, strict RFC 7230), upstream
    // unmaintained since 2026-01. Do not downgrade to 5.x — that is a breaking API change.
    activejGroup = 'com.github.Censseo.activej'
    activejVersion = 'v7.0.0'
    bouncycastleVersion = '1.85.2'  // 1.76 is vulnerable to CVE-2024-30172 — do not downgrade. 1.81+ required for Java 25 runtime.
    jsonVersion = '20240303'
    slf4jVersion = '2.0.12'
    // Runtime-only logging backend. Kept on the latest 1.5.x patch: 1.5.13 fixed CVE-2024-12798 /
    // CVE-2024-12801 (config-time expression/DTD injection). Do not drop below 1.5.13.
    logbackVersion = '1.5.38'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.freefair.lombok'

    sourceSets {
        test {
            java {
                srcDir 'src/java/test'
            }
        }
    }

    repositories {
        mavenCentral()
        // Custom activej build (activejGroup) is served from JitPack.
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        // Use JUnit Jupiter for testing.
        testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'
        // Gradle 9 no longer auto-detects the launcher; required to run tests.
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        // Pin the API surface too (release 25): a NoSuchMethodError class of escapes
        // arises when toolchain and release diverge.
        options.release = 25
    }

    tasks.named('test') {
        // Use JUnit Platform for unit tests.
        useJUnitPlatform()
        // Forward -Dbench* properties to the forked test JVM (benchmarks).
        System.properties.each { k, v ->
            if (k.toString().startsWith('bench')) {
                systemProperty(k.toString(), v.toString())
            }
        }
    }
}