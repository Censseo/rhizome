plugins {
    id 'java-library'
}

dependencies {
    // `api`, not `implementation`: the RocksDb* stores are public classes whose public signatures
    // return and accept lib-core types (ChainStore, Ledger, NonceStore, Block, BlockHeader), so
    // consumers cannot use this module without them. It compiled under `implementation` only
    // because app-node happens to declare lib-core itself.
    api project(':lib-core')
    // Same reasoning: RocksDbContractStore implements ContractStore and takes StorageChange in
    // public methods. (Nothing here touches Chicory — these two are plain domain interfaces.)
    api project(':lib-vm')

    implementation "${activejGroup}:activej-bytebuf:${activejVersion}"
    implementation "${activejGroup}:activej-common:${activejVersion}"

    // https://mvnrepository.com/artifact/org.iq80.leveldb/leveldb
    // Read-only, and only for PandaniteLedgerDumper: a Pandanite ledger directory is a LevelDB
    // database, and the dumper iterates one to produce the genesis snapshot. Rhizome itself
    // stores nothing in LevelDB — the legacy LevelDB store classes were removed as dead code.
    implementation 'org.iq80.leveldb:leveldb:0.12'

    // https://mvnrepository.com/artifact/org.rocksdb/rocksdbjni
    // Native store: the full-node performance path (column families, atomic write batches).
    api 'org.rocksdb:rocksdbjni:10.10.1'

    // https://mvnrepository.com/artifact/commons-io/commons-io
    implementation 'commons-io:commons-io:2.16.1'

    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    // ChainEngineTestAccess: the crash-recovery tests here pop the tip, which ChainEngine keeps
    // package-private on purpose. Test-scoped, so nothing in the published jar can reach it.
    testImplementation testFixtures(project(':lib-core'))

    testRuntimeOnly "ch.qos.logback:logback-classic:${logbackVersion}"
}
